<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Granco Saw Monitor — Crew Summary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <span class="app-header-title">Granco Saw Monitor — Crew Summary</span>
    <div style="display: flex; align-items: baseline; gap: 1rem;">
      <a class="app-header-subtitle app-header-link" href="index.html">&larr; Back to dashboard</a>
      <span id="last-updated" class="app-header-subtitle">-</span>
    </div>
  </header>

  <main>
    <section class="card card-wide">
      <h2>Shift Crew Summary</h2>
      <div id="shift-label" class="status-details">-</div>
      <div class="overflow-wrap">
        <table id="shift-summary-table">
          <thead>
            <tr>
              <th>Operator</th>
              <th>Clocked Time</th>
              <th>Production</th>
              <th>Setup</th>
              <th>Break</th>
              <th>Idle</th>
              <th>Other</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="crew.js"></script>
</body>
</html>
