<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Granco Saw Monitor — TV</title>
  <link rel="icon" type="image/png" href="uacj-icon.png">
  <style>
    :root { --color-bg: #eef1f6; }
    @media (prefers-color-scheme: dark) {
      :root { --color-bg: #14161a; }
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--color-bg);
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    iframe.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <iframe id="frame-dashboard" class="visible" src="index.html" title="Dashboard"></iframe>
  <iframe id="frame-board" src="board.html" title="Notes &amp; Schedule"></iframe>

  <script>
    // Both pages load once and keep polling in the background; we just
    // cross-fade which one is on top. Reloading src on every tick would
    // restart their own refresh timers and flash a blank page for no reason.
    const PAN_INTERVAL_MS = 60000;
    const frames = [
      document.getElementById('frame-dashboard'),
      document.getElementById('frame-board'),
    ];
    let current = 0;

    setInterval(() => {
      frames[current].classList.remove('visible');
      current = (current + 1) % frames.length;
      frames[current].classList.add('visible');
    }, PAN_INTERVAL_MS);
  </script>
</body>
</html>
