<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Granco Saw Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="tv-page">
  <header class="app-header">
    <span class="app-header-title">Granco Saw Monitor</span>
    <div style="display: flex; align-items: baseline; gap: 1rem;">
      <a class="app-header-subtitle app-header-link" href="shift-details.html">Shift Details &rarr;</a>
      <a class="app-header-subtitle app-header-link" href="schedule.html">Schedule &rarr;</a>
      <a class="app-header-subtitle app-header-link" href="board.html">Notes &amp; Board &rarr;</a>
      <span id="last-updated" class="app-header-subtitle">-</span>
    </div>
  </header>

  <main class="dashboard-grid">
    <div class="col col-left">
      <section id="status-card" class="card">
        <div class="status-row">
          <span id="state-badge" class="badge">UNKNOWN</span>
          <span id="staffing-badge" class="badge">- staffing -</span>
          <div class="status-details">
            <div><strong>Part:</strong> <span id="part-number">-</span></div>
            <div><strong>Last cut:</strong> <span id="last-cycle-ts">-</span></div>
            <div><strong>Operators:</strong> <span id="staffing-operators">-</span></div>
          </div>
        </div>
        <div id="staffing-stale-banner" class="stale-banner hidden"></div>
      </section>

      <section class="card card-wide cycles-card">
        <div class="status-row" style="justify-content: space-between; margin-bottom: 0.5rem;">
          <h2 style="margin: 0;">Recent Cycles</h2>
          <label class="cycles-toggle">
            <input type="checkbox" id="show-backgauge-toggle">
            Show backgauge position
          </label>
        </div>
        <div class="overflow-wrap">
          <table id="cycles-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Part</th>
                <th>Cut #</th>
                <th>Actual (s)</th>
                <th>Theory (s)</th>
                <th>Length (in)</th>
                <th class="col-backgauge">Backgauge (in)</th>
                <th>Parts</th>
                <th class="trim-reload-cell">Trim / Reload</th>
                <th>Grade</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="col col-right">
      <section class="card leaderboard-card">
        <h2>&#127942; Weekly Shift Leaderboard</h2>
        <div id="leaderboard-window" class="status-details" style="margin-bottom: 0.5rem;">-</div>
        <ol id="leaderboard-list" class="leaderboard-list"></ol>

        <div class="leaderboard-divider">&#9881;&#65039; Active Shifts This Week</div>
        <ol id="active-shifts-list" class="utilization-list"></ol>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
