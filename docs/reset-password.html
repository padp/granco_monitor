<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Granco Saw Monitor — Reset Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <span class="app-header-title">Granco Saw Monitor — Reset Password</span>
    <a class="app-header-subtitle app-header-link" href="schedule.html">&larr; Back to log in</a>
  </header>

  <main>
    <section id="reset-card" class="card">
      <h2>Set a New Password</h2>
      <form id="reset-form" class="form-grid">
        <label>
          New Password
          <input type="password" id="new-password" required minlength="8">
        </label>
        <label>
          Confirm Password
          <input type="password" id="confirm-password" required minlength="8">
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Set Password</button>
        </div>
      </form>
      <div id="reset-error" class="form-error"></div>
    </section>

    <section id="reset-success-card" class="card hidden">
      <h2>Password Updated</h2>
      <div class="status-details">Your password has been changed. <a href="schedule.html">Log in</a> with your new password.</div>
    </section>

    <section id="reset-missing-token-card" class="card hidden">
      <h2>Invalid Link</h2>
      <div class="status-details">This reset link is missing its token. Request a new one from the <a href="schedule.html">log in page</a>.</div>
    </section>
  </main>

  <script src="reset-password.js"></script>
</body>
</html>
