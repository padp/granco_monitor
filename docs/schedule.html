<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Granco Saw Monitor — Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <span class="app-header-title">Granco Saw Monitor — Schedule</span>
    <a class="app-header-subtitle app-header-link" href="index.html">&larr; Back to dashboard</a>
  </header>

  <main>
    <section id="auth-card" class="card">
      <h2 id="auth-title">Log In</h2>
      <form id="auth-form" class="form-grid">
        <label>
          Email
          <input type="email" id="auth-email" placeholder="you@uwh.uacj-group.com" required>
        </label>
        <label>
          Password
          <input type="password" id="auth-password" required minlength="8">
        </label>
        <div class="form-actions">
          <button type="submit" id="auth-submit" class="btn btn-primary">Log In</button>
          <button type="button" id="auth-toggle" class="btn btn-link">Need an account? Create one</button>
        </div>
      </form>
      <div id="auth-error" class="form-error"></div>
      <p class="form-status">Forgot your password? Contact your administrator to have it reset.</p>
    </section>

    <section id="schedule-card" class="card card-wide hidden">
      <div class="status-row" style="margin-bottom: 1rem;">
        <div class="status-details">Logged in as <strong id="current-email">-</strong></div>
        <button type="button" id="logout-btn" class="btn btn-link">Log out</button>
      </div>

      <h2>Notes for Operators</h2>
      <p class="form-status" style="margin-top: 0;">Shown on the board display - overwrites the current message, not a log.</p>
      <textarea id="notes-textarea" rows="4" style="width: 100%; font: inherit; padding: 0.6rem 0.7rem; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-bg); color: var(--color-text);"></textarea>
      <div class="form-actions">
        <button type="button" id="notes-save-btn" class="btn btn-secondary">Save Notes</button>
        <span id="notes-save-status" class="form-status"></span>
      </div>

      <hr style="border: none; border-top: 1px solid var(--color-border); margin: 1.25rem 0;">

      <div class="form-grid form-grid-inline">
        <label>
          Date
          <input type="date" id="schedule-date">
        </label>
        <label>
          Shift
          <select id="schedule-shift">
            <option>First Shift</option>
            <option>Second Shift</option>
            <option>Third Shift</option>
          </select>
        </label>
      </div>

      <div class="overflow-wrap">
        <table id="schedule-table">
          <thead>
            <tr>
              <th>Part Number</th>
              <th>Job Number</th>
              <th>Racks</th>
              <th>Scheduled Time</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="form-actions">
        <button type="button" id="add-row-btn" class="btn btn-secondary">+ Add Row</button>
        <button type="button" id="save-btn" class="btn btn-primary">Save Schedule</button>
        <span id="save-status" class="form-status"></span>
      </div>
    </section>
  </main>

  <script src="schedule.js"></script>
</body>
</html>
